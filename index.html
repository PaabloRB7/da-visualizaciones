<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dijkstra paso a paso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: herramienta de estudio en dos columnas (grafo + controles | pseudocódigo + tabla), una columna en móvil */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --fg: #1a2230;
  --muted: #5a6475;
  --line: #c3cad6;
  --accent: #2856c9;
  --accent-soft: #e4ebfb;
  --current: #b86e00;
  --current-soft: #fbefd9;
  --ok: #1d7f47;
  --no: #bf3434;
  --path: #7a3fc2;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151c; --surface: #19202a; --fg: #e5e9ef; --muted: #98a1b0; --line: #3b4553;
    --accent: #7ea3ff; --accent-soft: #23314f; --current: #f0a640; --current-soft: #3d2f17;
    --ok: #52c78a; --no: #f27474; --path: #c19bff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151c; --surface: #19202a; --fg: #e5e9ef; --muted: #98a1b0; --line: #3b4553;
  --accent: #7ea3ff; --accent-soft: #23314f; --current: #f0a640; --current-soft: #3d2f17;
  --ok: #52c78a; --no: #f27474; --path: #c19bff; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; }
body {
  background: transparent; color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 4px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header h1 { font-size: 1.6rem; margin: 0; text-wrap: balance; }
header p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 880px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.label { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 0; }
.opts { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
.opts label { display: flex; align-items: center; gap: 6px; }
select, button { font: inherit; color: var(--fg); }
select { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
svg { width: 100%; height: auto; display: block; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 700; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.counter { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }
.speed { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.explain { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; min-height: 4.5em; }
.explain b { font-weight: 700; }
.explain code, .mono { font-family: var(--font-mono); font-size: 0.9em; }
pre.code { margin: 0; font-family: var(--font-mono); font-size: 0.84rem; line-height: 1.7; overflow-x: auto; }
pre.code span { display: block; padding: 0 8px; border-radius: 4px; white-space: pre; }
pre.code span.on { background: var(--current-soft); color: var(--fg); box-shadow: inset 3px 0 0 var(--current); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-family: var(--font-mono); font-size: 0.86rem; }
th, td { border: 1px solid var(--line); padding: 5px 6px; text-align: center; }
th { color: var(--muted); font-weight: 600; }
td.k { background: var(--current-soft); }
td.j { box-shadow: inset 0 0 0 2px var(--ok); }
td.jno { box-shadow: inset 0 0 0 2px var(--no); }
td.fixed { color: var(--accent); font-weight: 600; }
.cset { font-family: var(--font-mono); font-size: 0.9rem; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 0.85rem; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); display: inline-block; }
.dot.fixed { background: var(--accent); border-color: var(--accent); }
.dot.cur { background: var(--current-soft); border-color: var(--current); }
.bar { width: 18px; height: 3px; display: inline-block; border-radius: 2px; }
.pathinfo { font-family: var(--font-mono); font-size: 0.9rem; color: var(--path); min-height: 1.4em; }
/* SVG */
.edge { stroke: var(--line); stroke-width: 2; fill: none; }
.edge.tree { stroke: var(--accent); stroke-width: 3; }
.edge.ok { stroke: var(--ok); stroke-width: 4; }
.edge.no { stroke: var(--no); stroke-width: 4; stroke-dasharray: 7 5; }
.edge.path { stroke: var(--path); stroke-width: 5; }
.w { font-family: var(--font-mono); font-size: 13px; fill: var(--muted); paint-order: stroke; stroke: var(--surface); stroke-width: 5px; stroke-linejoin: round; text-anchor: middle; dominant-baseline: middle; }
.w.hl { fill: var(--fg); font-weight: 600; }
.node circle { fill: var(--surface); stroke: var(--line); stroke-width: 2.5; }
.node text.id { font-family: var(--font-body); font-weight: 700; font-size: 15px; fill: var(--fg); text-anchor: middle; dominant-baseline: central; }
.node.fixed circle { fill: var(--accent); stroke: var(--accent); }
.node.fixed text.id { fill: var(--surface); }
.node.cur circle { fill: var(--current-soft); stroke: var(--current); stroke-width: 4; }
.node.cur text.id { fill: var(--fg); }
.node.tgt circle { stroke: var(--ok); stroke-width: 4; }
.node.tgtno circle { stroke: var(--no); stroke-width: 4; }
.node.origin circle { stroke: var(--fg); stroke-width: 3.5; }
.node.clickable { cursor: pointer; }
.dlab { font-family: var(--font-mono); font-size: 13px; text-anchor: middle; fill: var(--fg); paint-order: stroke; stroke: var(--surface); stroke-width: 5px; stroke-linejoin: round; }
.dlab.inf { fill: var(--muted); }
.mk-default { fill: var(--line); } .mk-tree { fill: var(--accent); } .mk-ok { fill: var(--ok); } .mk-no { fill: var(--no); } .mk-path { fill: var(--path); }
@media (prefers-reduced-motion: no-preference) {
  .edge, .node circle { transition: stroke 0.2s, fill 0.2s, stroke-width 0.2s; }
}
</style>
</head>
<body>

<div class="wrap">

  <div class="grid">
    <section class="panel" aria-label="Grafo y controles">
      <div class="opts">
        <label for="origin">Origen i
          <select id="origin"></select>
        </label>
        <label for="directed"><input type="checkbox" id="directed" checked> Grafo orientado (u → v)</label>
      </div>

      <svg id="graph" viewBox="0 0 600 385" role="img" aria-label="Grafo con 7 vértices">
        <defs>
          <marker id="arr-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-default" d="M0,0 L10,5 L0,10 z"/></marker>
          <marker id="arr-tree" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk-tree" d="M0,0 L10,5 L0,10 z"/></marker>
          <marker id="arr-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="mk-ok" d="M0,0 L10,5 L0,10 z"/></marker>
          <marker id="arr-no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="mk-no" d="M0,0 L10,5 L0,10 z"/></marker>
          <marker id="arr-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path class="mk-path" d="M0,0 L10,5 L0,10 z"/></marker>
        </defs>
        <g id="edges"></g>
        <g id="nodes"></g>
      </svg>

      <div class="legend" aria-label="Leyenda">
        <span><i class="dot"></i>Candidato (en C)</span>
        <span><i class="dot cur"></i>k seleccionado</span>
        <span><i class="dot fixed"></i>Fijado (d definitivo)</span>
        <span><i class="bar" style="background:var(--accent)"></i>Arista c[j] → j</span>
        <span><i class="bar" style="background:var(--ok)"></i>Mejora d[j]</span>
        <span><i class="bar" style="background:var(--no)"></i>No mejora</span>
      </div>

      <div class="controls">
        <button class="btn" id="reset" type="button">Reiniciar</button>
        <button class="btn" id="prev" type="button">◀ Anterior</button>
        <button class="btn primary" id="next" type="button">Siguiente ▶</button>
        <button class="btn" id="play" type="button">Reproducir</button>
        <label class="speed" for="speed">Velocidad <input type="range" id="speed" min="300" max="2500" step="100" value="1300"></label>
        <span class="counter" id="counter"></span>
      </div>

      <div class="explain" id="explain" aria-live="polite"></div>
      <div class="pathinfo" id="pathinfo"></div>
    </section>

    <section class="panel" aria-label="Pseudocódigo y estado">
      <p class="label">Pseudocódigo (diapositivas)</p>
      <pre class="code" id="code"></pre>
      <p class="label">Estado</p>
      <div class="cset" id="cset"></div>
      <div class="tablewrap"><table id="state"></table></div>
    </section>
  </div>
</div>

<script>
(function () {
  const INF = Infinity;
  const N = 7;
  const POS = [[70,190],[200,80],[360,60],[200,300],[330,190],[530,190],[380,320]];
  const EDGES = [[0,1,1],[0,3,4],[1,2,2],[1,3,6],[1,4,4],[2,4,5],[2,5,6],[3,4,3],[3,6,4],[4,5,8],[4,6,7],[5,6,3]];
  const R = 20;
  // posición de la etiqueta d=… respecto a cada vértice, elegida para no pisar aristas
  const LAB = [[0,38],[0,-29],[0,-29],[0,38],[-44,5],[0,38],[0,38]];
  const CODE = [
    "Dijkstra(p, n, i) → (c, d)",
    "C ← ∅",
    "desde j ← 1 hasta n",
    "    C ← C ∪ {j}",
    "    (c[j], d[j]) ← (i, p[i, j])",
    "C ← C − {i}",
    "mientras C ≠ ∅",
    "    k ← selecciona-vértice(C, d)",
    "    C ← C − {k}",
    "    para todo j ∈ C",
    "        si d[k] + p[k, j] < d[j]",
    "            (c[j], d[j]) ← (k, d[k] + p[k, j])"
  ];

  const $ = id => document.getElementById(id);
  const fmt = v => v === INF ? "∞" : String(v);
  const setStr = arr => "{" + arr.join(", ") + "}";

  let steps = [], cur = 0, timer = null, selectedPath = null;

  function buildP(directed) {
    const p = Array.from({length: N}, (_, i) => Array.from({length: N}, (_, j) => i === j ? 0 : INF));
    for (const [u, v, w] of EDGES) { p[u][v] = w; if (!directed) p[v][u] = w; }
    return p;
  }

  function snap(o) {
    return { C: o.C.slice(), d: o.d.slice(), c: o.c.slice(), fixed: o.fixed.slice(),
      type: o.type, k: o.k, j: o.j, improve: o.improve, lines: o.lines, text: o.text };
  }

  function simulate(origin, directed) {
    const p = buildP(directed);
    const st = { C: [], d: [], c: [], fixed: Array(N).fill(false), k: null, j: null, improve: null };
    for (let j = 0; j < N; j++) { st.d[j] = p[origin][j]; st.c[j] = origin; if (j !== origin) st.C.push(j); }
    st.fixed[origin] = true;
    const out = [];
    const direct = st.C.filter(j => st.d[j] !== INF);
    out.push(snap(Object.assign(st, { type: "init", lines: [1,2,3,4,5],
      text: `<b>Inicialización.</b> Todos los vértices salvo el origen <b>${origin}</b> son candidatos: C = ${setStr(st.C)}. ` +
        `Cada d[j] empieza con el peso de la arista directa ${origin} → j y c[j] = ${origin}. ` +
        (direct.length ? `Hay arista directa a ${direct.join(", ")}; el resto empieza en ∞.` : `No sale ninguna arista de ${origin}: todos empiezan en ∞.`) })));

    while (st.C.length) {
      let k = null, v = INF;
      for (const j of st.C) if (st.d[j] < v) { v = st.d[j]; k = j; }
      let allInf = false;
      if (k === null) { k = st.C[0]; allInf = true; }
      const before = st.C.slice();
      st.C = st.C.filter(x => x !== k);
      st.fixed[k] = true;
      const reach = st.C.filter(j => p[k][j] !== INF);
      let t;
      if (allInf) {
        t = `Todos los candidatos ${setStr(before)} tienen d = ∞: no son accesibles desde el origen. Se toma k = <b>${k}</b>, pero ya no se puede mejorar ningún camino.`;
      } else {
        t = `<b>Selección.</b> De los candidatos ${setStr(before)}, el de menor d es k = <b>${k}</b> con d[${k}] = ${fmt(st.d[k])}. Sale de C y su valor ya es <b>definitivo</b>. `;
        t += reach.length
          ? `Ahora se prueba a llegar a los candidatos con arista desde ${k}: ${reach.join(", ")}. Para el resto p[${k}, j] = ∞ y no cambia nada.`
          : `No sale ninguna arista de ${k} hacia los candidatos que quedan, así que no se actualiza nada.`;
      }
      out.push(snap(Object.assign(st, { type: "select", k, j: null, improve: null, lines: [7, 8], text: t })));

      for (const j of st.C) {
        if (p[k][j] === INF) continue;
        const nd = st.d[k] + p[k][j];
        const old = st.d[j];
        const improve = nd < old;
        let tx = `<b>¿d[${k}] + p[${k}, ${j}] &lt; d[${j}]?</b> ${fmt(st.d[k])} + ${p[k][j]} = ${nd} frente a ${fmt(old)}. `;
        if (improve) {
          st.d[j] = nd; st.c[j] = k;
          tx += `<b>Sí:</b> llegar a ${j} pasando por ${k} es mejor. Se actualiza d[${j}] = ${nd} y c[${j}] = ${k}.`;
        } else {
          tx += `<b>No:</b> el camino que ya se conocía hasta ${j} es igual o mejor. No cambia nada.`;
        }
        out.push(snap(Object.assign(st, { type: "relax", k, j, improve, lines: improve ? [9, 10, 11] : [9, 10], text: tx })));
      }
    }
    const fin = st.d.map((x, i) => `d[${i}] = ${fmt(x)}`).join(", ");
    out.push(snap(Object.assign(st, { type: "end", k: null, j: null, improve: null, lines: [6],
      text: `<b>Fin.</b> C está vacío. Pesos de los caminos mínimos desde ${origin}: ${fin}. Las aristas azules forman los caminos (c[j] → j). <b>Haz clic en un vértice</b> para reconstruir su camino con c.` })));
    return out;
  }

  // ---- render ----
  const svgNS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, parent) {
    const e = document.createElementNS(svgNS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  function pathEdges(s, target, origin) {
    const set = new Set();
    if (s.d[target] === INF || target === origin) return set;
    let j = target, guard = 0;
    while (j !== origin && guard++ < N) { set.add(s.c[j] + "-" + j); j = s.c[j]; }
    return set;
  }

  function render() {
    const s = steps[cur];
    const directed = $("directed").checked;
    const origin = +$("origin").value;
    const pset = (s.type === "end" && selectedPath !== null) ? pathEdges(s, selectedPath, origin) : new Set();

    const ge = $("edges"); ge.innerHTML = "";
    for (const [u, v, w] of EDGES) {
      let cls = "default";
      let from = u, to = v;
      const isRelax = s.type === "relax" && ((s.k === u && s.j === v) || (!directed && s.k === v && s.j === u));
      if (isRelax) { cls = s.improve ? "ok" : "no"; from = s.k; to = s.j; }
      else if (pset.has(u + "-" + v) || (!directed && pset.has(v + "-" + u))) {
        cls = "path"; if (!directed && pset.has(v + "-" + u)) { from = v; to = u; }
      } else {
        const t1 = v !== origin && s.c[v] === u && s.d[v] !== INF;
        const t2 = !directed && u !== origin && s.c[u] === v && s.d[u] !== INF;
        if (t1) cls = "tree";
        else if (t2) { cls = "tree"; from = v; to = u; }
      }
      const [x1, y1] = POS[from], [x2, y2] = POS[to];
      const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
      const ux = dx / L, uy = dy / L;
      const pad = directed || cls === "path" || cls === "ok" || cls === "no" ? R + 3 : R;
      const a = { class: "edge " + cls, x1: x1 + ux * R, y1: y1 + uy * R, x2: x2 - ux * pad, y2: y2 - uy * pad };
      if (directed) a["marker-end"] = "url(#arr-" + cls + ")";
      el("line", a, ge);
      const mx = (x1 + x2) / 2 - uy * 12, my = (y1 + y2) / 2 + ux * 12;
      const t = el("text", { class: "w" + (cls !== "default" ? " hl" : ""), x: mx, y: my }, ge);
      t.textContent = w;
    }

    const gn = $("nodes"); gn.innerHTML = "";
    for (let i = 0; i < N; i++) {
      let cls = "node";
      if (s.fixed[i]) cls += " fixed";
      if ((s.type === "select" || s.type === "relax") && s.k === i) cls = "node cur";
      if (s.type === "relax" && s.j === i) cls += s.improve ? " tgt" : " tgtno";
      if (i === origin) cls += " origin";
      if (s.type === "end") cls += " clickable";
      const g = el("g", { class: cls, "data-v": i }, gn);
      const [x, y] = POS[i];
      el("circle", { cx: x, cy: y, r: R }, g);
      const t = el("text", { class: "id", x, y }, g); t.textContent = i;
      const [ox, oy] = LAB[i];
      const dl = el("text", { class: "dlab" + (s.d[i] === INF ? " inf" : ""), x: x + ox, y: y + oy }, g);
      dl.textContent = i === origin ? "origen" : "d=" + fmt(s.d[i]);
      if (s.type === "end") {
        g.addEventListener("click", () => { selectedPath = i; render(); });
        g.setAttribute("tabindex", "0"); g.setAttribute("role", "button");
        g.setAttribute("aria-label", "Ver camino a " + i);
        g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectedPath = i; render(); } });
      }
    }

    $("code").innerHTML = CODE.map((l, i) => `<span class="${s.lines.includes(i) ? "on" : ""}">${l.replace(/</g, "&lt;")}</span>`).join("");
    $("cset").textContent = "C = " + (s.C.length ? setStr(s.C) : "∅");

    let h = "<tr><th>j</th>";
    for (let i = 0; i < N; i++) h += `<th>${i}</th>`;
    h += "</tr>";
    const cellCls = i => {
      const c = [];
      if ((s.type === "select" || s.type === "relax") && s.k === i) c.push("k");
      if (s.type === "relax" && s.j === i) c.push(s.improve ? "j" : "jno");
      if (s.fixed[i]) c.push("fixed");
      return c.join(" ");
    };
    h += "<tr><th>d[j]</th>" + s.d.map((v, i) => `<td class="${cellCls(i)}">${fmt(v)}</td>`).join("") + "</tr>";
    h += "<tr><th>c[j]</th>" + s.c.map((v, i) => `<td class="${cellCls(i)}">${i === origin ? "–" : v}</td>`).join("") + "</tr>";
    h += "<tr><th>estado</th>" + s.fixed.map((f, i) => `<td class="${cellCls(i)}">${i === origin ? "origen" : f ? "fijado" : "en C"}</td>`).join("") + "</tr>";
    $("state").innerHTML = h;

    $("explain").innerHTML = s.text;
    $("counter").textContent = `Paso ${cur + 1} de ${steps.length}`;
    $("prev").disabled = cur === 0;
    $("next").disabled = cur === steps.length - 1;

    let pi = "";
    if (s.type === "end" && selectedPath !== null) {
      if (selectedPath === origin) pi = `${origin} es el origen.`;
      else if (s.d[selectedPath] === INF) pi = `${selectedPath} no es accesible desde ${origin}.`;
      else {
        const L = [selectedPath]; let j = selectedPath, g = 0;
        const back = [`c[${j}] = ${s.c[j]}`];
        while (j !== origin && g++ < N) { j = s.c[j]; L.unshift(j); if (j !== origin) back.push(`c[${j}] = ${s.c[j]}`); }
        pi = `Camino a ${selectedPath}: ${L.join(" → ")}  (peso ${s.d[selectedPath]})   ·   ${back.join(", ")}`;
      }
    }
    $("pathinfo").textContent = pi;
  }

  function rebuild() {
    stop();
    selectedPath = null;
    steps = simulate(+$("origin").value, $("directed").checked);
    cur = 0;
    render();
  }

  function go(n) { cur = Math.max(0, Math.min(steps.length - 1, n)); if (steps[cur].type !== "end") selectedPath = null; render(); }
  function stop() { if (timer) { clearInterval(timer); timer = null; } $("play").textContent = "Reproducir"; }
  function play() {
    if (timer) { stop(); return; }
    if (cur === steps.length - 1) go(0);
    $("play").textContent = "Pausa";
    timer = setInterval(() => { if (cur >= steps.length - 1) { stop(); return; } go(cur + 1); }, 2800 - +$("speed").value);
  }

  const sel = $("origin");
  for (let i = 0; i < N; i++) { const o = document.createElement("option"); o.value = i; o.textContent = i; sel.appendChild(o); }
  sel.value = "0";
  sel.addEventListener("change", rebuild);
  $("directed").addEventListener("change", rebuild);
  $("reset").addEventListener("click", () => { stop(); go(0); });
  $("prev").addEventListener("click", () => { stop(); go(cur - 1); });
  $("next").addEventListener("click", () => { stop(); go(cur + 1); });
  $("play").addEventListener("click", play);
  $("speed").addEventListener("input", () => { if (timer) { stop(); play(); } });
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
    if (e.key === "ArrowRight") { stop(); go(cur + 1); }
    if (e.key === "ArrowLeft") { stop(); go(cur - 1); }
  });

  rebuild();
})();
</script>
</body>
</html>
